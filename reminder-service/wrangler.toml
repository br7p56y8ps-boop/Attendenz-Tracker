name = "attendenz-a1-reminder-service"
main = "src/index.ts"
compatibility_date = "2026-08-24"

[triggers]
crons = ["*/5 * * * *"]

[vars]
ALLOWED_ORIGIN = "https://benz-attendance-tracker.pages.dev"

# Create the D1 database first, then replace the placeholder database_id.
[[d1_databases]]
binding = "DB"
database_name = "attendenz-reminders"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"

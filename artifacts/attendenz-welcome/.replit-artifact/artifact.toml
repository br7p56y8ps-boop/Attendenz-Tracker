kind = "video"
previewPath = "/attendenz-welcome/"
title = "Attendenz Welcome Animation"
version = "1.0.0"
id = "artifacts/attendenz-welcome"
router = "path"

[[services]]
name = "web"
paths = [ "/attendenz-welcome/" ]
localPort = 23452

[services.development]
run = "pnpm --filter @workspace/attendenz-welcome run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/attendenz-welcome", "run", "build" ]
serve = "static"
publicDir = "artifacts/attendenz-welcome/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23452"
BASE_PATH = "/attendenz-welcome/"
